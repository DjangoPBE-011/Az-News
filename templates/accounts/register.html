{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block content %}

<div class="container"
     style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:50px 15px;background:linear-gradient(135deg,#ffffff,#fff5f5);">

    <div class="row justify-content-center" style="width:100%;">

        <div class="col-md-6"
             style="max-width:520px;padding:45px 40px;background:#ffffff;border-radius:24px;border:1px solid #f1d0d0;box-shadow:0 20px 50px rgba(180,0,0,.12);">

            <div style="text-align:center;margin-bottom:30px;">

                <div style="width:65px;height:65px;margin:0 auto 15px;background:#fff0f0;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #e53935;">

                    <i class="fas fa-user-plus"
                       style="font-size:25px;color:#e53935;">
                    </i>

                </div>

                <h2 style="margin:0;color:#222;font-size:34px;font-weight:700;letter-spacing:.5px;">
                    Create Account
                </h2>

                <p style="margin-top:8px;color:#888;font-size:14px;">
                    Create your account and join us
                </p>

            </div>

            <form method="post">

                {% csrf_token %}

                <div style="color:#333;">
                    {{ form.as_p }}
                </div>

                <button type="submit"
                        style="width:100%;padding:14px;margin-top:10px;border:none;border-radius:12px;background:linear-gradient(135deg,#ef5350,#c62828);color:#ffffff;font-size:15px;font-weight:700;letter-spacing:.5px;cursor:pointer;box-shadow:0 8px 20px rgba(198,40,40,.25);">
                    <i class="fas fa-user-plus" style="margin-right:8px;"></i>
                    Create Account
                </button>

            </form>

            <div style="text-align:center;margin-top:25px;padding-top:20px;border-top:1px solid #eeeeee;color:#888;font-size:14px;">

                Already have an account?

                <a href="{% url 'accounts:login' %}"
                   style="color:#d32f2f;text-decoration:none;font-weight:700;margin-left:5px;">
                    Sign In
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
